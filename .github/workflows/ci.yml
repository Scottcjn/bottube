name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Explicit per-job timeout: fail fast (10 min) instead of the default 15-min
    # silent cancel when the runner is unavailable or a step hangs.
    # See https://github.com/Scottcjn/bottube/issues/1640 for the original problem.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install --retries 3 --timeout 60 flake8 pylint
        if [ -f requirements.txt ]; then pip install --retries 3 --timeout 60 -r requirements.txt; fi

    - name: Lint with flake8
      timeout-minutes: 3
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Lint with pylint
      continue-on-error: true
      timeout-minutes: 3
      run: |
        pylint bottube_server.py --disable=C,R,W || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install --retries 3 --timeout 60 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install --retries 3 --timeout 60 -r requirements.txt; fi

    - name: Run tests
      timeout-minutes: 5
      run: |
        pytest tests/ -v --cov=. --cov-report=xml || true

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: always()
      timeout-minutes: 3

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install --retries 3 --timeout 60 bandit safety
        if [ -f requirements.txt ]; then pip install --retries 3 --timeout 60 -r requirements.txt; fi

    - name: Run Bandit security linter
      continue-on-error: true
      timeout-minutes: 3
      run: |
        bandit -r . -x ./tests || true

    - name: Check dependencies for vulnerabilities
      continue-on-error: true
      timeout-minutes: 3
      run: |
        safety check || true
