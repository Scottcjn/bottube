name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# If several workflows fire on the same commit (push + PR, or rapid
# pushes), don't queue a pile of redundant runs: cancel the superseded
# ones. This reduces runner load and avoids the resource-exhaustion
# pattern where jobs wait forever for a hosted runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Explicit job-level timeout: a hung step now fails the job with a
    # clear "exceeded the maximum execution time" annotation instead of
    # silently waiting (the default is 360 minutes).
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 flake8 pylint
      timeout-minutes: 8

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      timeout-minutes: 5

    # Advisory only: reports pylint errors (E/F) in the job log and shows the
    # step as failed, but does not fail the lint job. flake8 above is the gate.
    - name: Lint with pylint (advisory, non-blocking)
      continue-on-error: true
      run: |
        pylint bottube_server.py --disable=C,R,W
      timeout-minutes: 5

  test:
    runs-on: ubuntu-latest
    # The suite takes ~8 min locally without coverage; leave headroom.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 -r requirements-ci.txt
      timeout-minutes: 8

    # Fail closed: a failing test fails this job. Known pre-existing failures
    # are quarantined one node ID at a time in tests/ci_quarantine.py as
    # strict xfails (tracked in the issue linked there); a quarantined test
    # that starts passing also fails the job, so the list can only shrink.
    # --timeout turns a hung test into a failure instead of eating the step.
    - name: Run tests
      run: |
        pytest tests/ -v --timeout=120 --cov=. --cov-report=xml
      timeout-minutes: 18

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: always()
      timeout-minutes: 5

  # 2026-09-07: deployment-drift was added after the timeout hardening in
  # #1742.  Without explicit timeouts it inherits the 360-minute default and
  # would hang forever in a network outage — the same class of failure that
  # bounty #16472 was opened to fix.  We add the same per-job / per-step
  # timeout budget here so CI stays fast-failing.  (See also the report job
  # which now distinguishes timeout vs real failure for this job.)
  deployment-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - name: Install drift check dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 pytest PyYAML
      timeout-minutes: 8

    - name: Test deployment drift sentinel
      run: python -m pytest tests/test_deployment_drift.py tests/test_openapi_contract_preservation.py -q
      timeout-minutes: 5

    - name: Check OpenAPI and Flask route drift
      run: python deployment_drift.py --config deployment-drift.json
      timeout-minutes: 5

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 3

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 bandit pip-audit
      timeout-minutes: 8

    # Full report of every severity, for reading in the log. Never blocks.
    - name: Bandit full report (advisory, non-blocking)
      continue-on-error: true
      run: |
        bandit -r . -x ./tests,./python-sdk/tests -q
      timeout-minutes: 5

    # High-severity AND high-confidence findings only (-lll -iii).
    # ADVISORY for now: two pre-existing B324 findings (hashlib.md5 used for
    # avatar colours in bottube_server.py, which only need
    # usedforsecurity=False) would fail it. Once those are fixed, delete the
    # continue-on-error line below to make this step a hard gate.
    - name: Bandit high severity / high confidence
      continue-on-error: true
      run: |
        bandit -r . -x ./tests,./python-sdk/tests -lll -iii
      timeout-minutes: 5

    # pip-audit replaces the deprecated `safety check`. Audits the pinned
    # CI/runtime dependency list. Advisory: a new upstream CVE should not
    # block unrelated PRs, but the step shows as failed in the log.
    - name: Audit dependencies with pip-audit (advisory, non-blocking)
      continue-on-error: true
      run: |
        pip-audit -r requirements-ci.txt
      timeout-minutes: 5

  # Outcome report: tells the contributor *why* a check is red.
  # A job cancelled by its timeout-minutes limit reports "cancelled";
  # a job where a step exited non-zero reports "failure". That
  # distinction is the difference between "CI infra hung" and
  # "your code failed", which is exactly what the 15m01s failures
  # obscured.
  report:
    name: CI outcome report
    runs-on: ubuntu-latest
    needs: [lint, test, security, deployment-drift]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Distinguish timeout from failure
        run: |
          L="${{ needs.lint.result }}"
          T="${{ needs.test.result }}"
          S="${{ needs.security.result }}"
          D="${{ needs.deployment-drift.result }}"
          echo "lint=$L test=$T security=$S deployment_drift=$D"
          if echo "$L $T $S $D" | grep -q cancelled; then
            echo "::error::A CI job was CANCELLED at its timeout-minutes limit (infrastructure hang, not necessarily a code failure). Re-run the workflow to confirm."
            exit 1
          elif echo "$L $T $S $D" | grep -qE 'failure|error'; then
            echo "::error::A CI job FAILED on a step. Look at the failing job's logs above - that is a real failure."
            exit 1
          else
            echo "All CI jobs completed successfully."
          fi
