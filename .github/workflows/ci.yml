name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# If several workflows fire on the same commit (push + PR, or rapid
# pushes), don't queue a pile of redundant runs: cancel the superseded
# ones. This reduces runner load and avoids the resource-exhaustion
# pattern where jobs wait forever for a hosted runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Explicit job-level timeout: a hung step now fails the job with a
    # clear "exceeded the maximum execution time" annotation instead of
    # silently waiting (the default is 360 minutes).
    timeout-minutes: 10
    outputs:
      failure_kind: ${{ steps.classify.outputs.failure_kind }}
    steps:
    - id: checkout
      uses: actions/checkout@v7
      timeout-minutes: 3

    - id: setup_python
      name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - id: install
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 flake8 pylint
      timeout-minutes: 8

    - id: flake8
      name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      timeout-minutes: 5

    # Advisory only: reports pylint errors (E/F) in the job log and shows the
    # step as failed, but does not fail the lint job. flake8 above is the gate.
    - id: pylint
      name: Lint with pylint (advisory, non-blocking)
      continue-on-error: true
      run: |
        pylint bottube_server.py --disable=C,R,W
      timeout-minutes: 5

    - id: classify
      name: Classify lint outcome
      if: always()
      timeout-minutes: 1
      run: |
        if [ "${{ steps.checkout.outcome }}" = "cancelled" ] || \
           [ "${{ steps.setup_python.outcome }}" = "cancelled" ] || \
           [ "${{ steps.install.outcome }}" = "cancelled" ] || \
           [ "${{ steps.flake8.outcome }}" = "cancelled" ] || \
           [ "${{ steps.checkout.outcome }}" = "failure" ] || \
           [ "${{ steps.setup_python.outcome }}" = "failure" ] || \
           [ "${{ steps.install.outcome }}" = "failure" ]; then
          echo "failure_kind=step_timeout_or_infra" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.flake8.outcome }}" = "failure" ]; then
          echo "failure_kind=code_failure" >> "$GITHUB_OUTPUT"
        else
          echo "failure_kind=success" >> "$GITHUB_OUTPUT"
        fi

  test:
    runs-on: ubuntu-latest
    # The suite takes ~8 min locally without coverage; leave headroom.
    timeout-minutes: 20
    outputs:
      failure_kind: ${{ steps.classify.outputs.failure_kind }}
    steps:
    - id: checkout
      uses: actions/checkout@v7
      timeout-minutes: 3

    - id: setup_python
      name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - id: install
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 -r requirements-ci.txt
      timeout-minutes: 8

    # Fail closed: a failing test fails this job. Known pre-existing failures
    # are quarantined one node ID at a time in tests/ci_quarantine.py as
    # strict xfails (tracked in the issue linked there); a quarantined test
    # that starts passing also fails the job, so the list can only shrink.
    # --timeout turns a hung test into a failure instead of eating the step.
    - id: pytest
      name: Run tests
      run: |
        pytest tests/ -v --timeout=120 --cov=. --cov-report=xml
      timeout-minutes: 18

    - id: codecov
      name: Upload coverage
      uses: codecov/codecov-action@v7
      if: always()
      continue-on-error: true
      timeout-minutes: 5

    - id: classify
      name: Classify test outcome
      if: always()
      timeout-minutes: 1
      run: |
        if [ "${{ steps.checkout.outcome }}" = "cancelled" ] || \
           [ "${{ steps.setup_python.outcome }}" = "cancelled" ] || \
           [ "${{ steps.install.outcome }}" = "cancelled" ] || \
           [ "${{ steps.pytest.outcome }}" = "cancelled" ] || \
           [ "${{ steps.checkout.outcome }}" = "failure" ] || \
           [ "${{ steps.setup_python.outcome }}" = "failure" ] || \
           [ "${{ steps.install.outcome }}" = "failure" ]; then
          echo "failure_kind=step_timeout_or_infra" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.pytest.outcome }}" = "failure" ]; then
          echo "failure_kind=code_failure" >> "$GITHUB_OUTPUT"
        else
          echo "failure_kind=success" >> "$GITHUB_OUTPUT"
        fi

  # 2026-09-07: deployment-drift was added after the timeout hardening in
  # #1742.  Without explicit timeouts it inherits the 360-minute default and
  # would hang forever in a network outage — the same class of failure that
  # bounty #16472 was opened to fix.  We add the same per-job / per-step
  # timeout budget here so CI stays fast-failing.  (See also the report job
  # which now distinguishes timeout vs real failure for this job.)
  deployment-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure_kind: ${{ steps.classify.outputs.failure_kind }}
    steps:
    - id: checkout
      uses: actions/checkout@v7
      timeout-minutes: 3

    - id: setup_python
      name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - id: install
      name: Install drift check dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 pytest PyYAML
      timeout-minutes: 8

    - id: drift_test
      name: Test deployment drift sentinel
      run: python -m pytest tests/test_deployment_drift.py tests/test_openapi_contract_preservation.py -q
      timeout-minutes: 5

    - id: drift_cli
      name: Check OpenAPI and Flask route drift
      run: python deployment_drift.py --config deployment-drift.json
      timeout-minutes: 5

    - id: classify
      name: Classify deployment-drift outcome
      if: always()
      timeout-minutes: 1
      run: |
        if [ "${{ steps.checkout.outcome }}" = "cancelled" ] || \
           [ "${{ steps.setup_python.outcome }}" = "cancelled" ] || \
           [ "${{ steps.install.outcome }}" = "cancelled" ] || \
           [ "${{ steps.drift_test.outcome }}" = "cancelled" ] || \
           [ "${{ steps.drift_cli.outcome }}" = "cancelled" ] || \
           [ "${{ steps.checkout.outcome }}" = "failure" ] || \
           [ "${{ steps.setup_python.outcome }}" = "failure" ] || \
           [ "${{ steps.install.outcome }}" = "failure" ]; then
          echo "failure_kind=step_timeout_or_infra" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.drift_test.outcome }}" = "failure" ] || \
             [ "${{ steps.drift_cli.outcome }}" = "failure" ]; then
          echo "failure_kind=code_failure" >> "$GITHUB_OUTPUT"
        else
          echo "failure_kind=success" >> "$GITHUB_OUTPUT"
        fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failure_kind: ${{ steps.classify.outputs.failure_kind }}
    steps:
    - id: checkout
      uses: actions/checkout@v7
      timeout-minutes: 3

    - id: setup_python
      name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
      timeout-minutes: 5

    - id: install
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip --timeout 30
        pip install --timeout 30 bandit pip-audit
      timeout-minutes: 8

    # Full report of every severity, for reading in the log. Never blocks.
    - id: bandit_advisory
      name: Bandit full report (advisory, non-blocking)
      continue-on-error: true
      run: |
        bandit -r . -x ./tests,./python-sdk/tests -q
      timeout-minutes: 5

    # High-severity AND high-confidence findings only (-lll -iii); this step
    # is a hard gate.
    - id: bandit
      name: Bandit high severity / high confidence
      run: |
        bandit -r . -x ./tests,./python-sdk/tests -lll -iii
      timeout-minutes: 5

    # pip-audit replaces the deprecated `safety check`. Audits the pinned
    # CI/runtime dependency list. Advisory: a new upstream CVE should not
    # block unrelated PRs, but the step shows as failed in the log.
    - id: pip_audit
      name: Audit dependencies with pip-audit (advisory, non-blocking)
      continue-on-error: true
      run: |
        pip-audit -r requirements-ci.txt
      timeout-minutes: 5

    - id: classify
      name: Classify security outcome
      if: always()
      timeout-minutes: 1
      run: |
        if [ "${{ steps.checkout.outcome }}" = "cancelled" ] || \
           [ "${{ steps.setup_python.outcome }}" = "cancelled" ] || \
           [ "${{ steps.install.outcome }}" = "cancelled" ] || \
           [ "${{ steps.bandit.outcome }}" = "cancelled" ] || \
           [ "${{ steps.checkout.outcome }}" = "failure" ] || \
           [ "${{ steps.setup_python.outcome }}" = "failure" ] || \
           [ "${{ steps.install.outcome }}" = "failure" ]; then
          echo "failure_kind=step_timeout_or_infra" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.bandit.outcome }}" = "failure" ]; then
          echo "failure_kind=code_failure" >> "$GITHUB_OUTPUT"
        else
          echo "failure_kind=success" >> "$GITHUB_OUTPUT"
        fi

  # Outcome report: tells the contributor *why* a check is red.
  # Previously, when a step hit its step-level timeout-minutes (or pip/checkout
  # failed), GitHub Actions set needs.<job>.result="failure" rather than
  # "cancelled", so this job falsely blamed the contributor's code. Now it
  # inspects both needs.<job>.result and needs.<job>.outputs.failure_kind.
  report:
    name: CI outcome report
    runs-on: ubuntu-latest
    needs: [lint, test, security, deployment-drift]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Distinguish timeout from failure
        timeout-minutes: 1
        env:
          LK: ${{ needs.lint.outputs.failure_kind }}
          TK: ${{ needs.test.outputs.failure_kind }}
          SK: ${{ needs.security.outputs.failure_kind }}
          DK: ${{ needs.deployment-drift.outputs.failure_kind }}
        run: |
          L="${{ needs.lint.result }}"
          T="${{ needs.test.result }}"
          S="${{ needs.security.result }}"
          D="${{ needs.deployment-drift.result }}"
          echo "results: lint=$L(${LK:-}) test=$T(${TK:-}) security=$S(${SK:-}) deployment_drift=$D(${DK:-})"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### BoTTube CI Outcome Summary"
              echo "| Job | Job Result | Attribution |"
              echo "|---|---|---|"
              echo "| lint | \`$L\` | \`${LK:-job_cancelled_or_not_acquired}\` |"
              echo "| test | \`$T\` | \`${TK:-job_cancelled_or_not_acquired}\` |"
              echo "| security | \`$S\` | \`${SK:-job_cancelled_or_not_acquired}\` |"
              echo "| deployment-drift | \`$D\` | \`${DK:-job_cancelled_or_not_acquired}\` |"
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi
          if echo "$L $T $S $D" | grep -q cancelled || echo "${LK:-} ${TK:-} ${SK:-} ${DK:-}" | grep -q step_timeout_or_infra; then
            echo "::error::A CI job was CANCELLED or a CI step TIMED OUT / hit a runner or package-index infrastructure stall (not a contributor code failure). Re-run the workflow to confirm."
            exit 1
          elif echo "$L $T $S $D" | grep -qE 'failure|error'; then
            echo "::error::A CI job FAILED on a code/test check step. Inspect the failing job's logs above."
            exit 1
          else
            echo "All CI jobs completed successfully."
          fi
