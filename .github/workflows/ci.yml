name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      timeout-minutes: 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip --timeout 60
        pip install flake8 pylint --timeout 60
        if [ -f requirements.txt ]; then pip install -r requirements.txt --timeout 60; fi
    
    - name: Lint with flake8
      timeout-minutes: 3
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Lint with pylint
      timeout-minutes: 3
      continue-on-error: true
      run: |
        pylint bottube_server.py --disable=C,R,W || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      timeout-minutes: 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip --timeout 60
        pip install pytest pytest-cov --timeout 60
        if [ -f requirements.txt ]; then pip install -r requirements.txt --timeout 60; fi
    
    - name: Run tests
      timeout-minutes: 5
      run: |
        pytest tests/ -v --cov=. --cov-report=xml || true
    
    - name: Upload coverage
      timeout-minutes: 3
      uses: codecov/codecov-action@v4
      if: always()

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      timeout-minutes: 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip --timeout 60
        pip install bandit safety --timeout 60
        if [ -f requirements.txt ]; then pip install -r requirements.txt --timeout 60; fi
    
    - name: Run Bandit security linter
      timeout-minutes: 3
      continue-on-error: true
      run: |
        bandit -r . -x ./tests || true
    
    - name: Check dependencies for vulnerabilities
      timeout-minutes: 3
      continue-on-error: true
      run: |
        safety check || true
