name: RTC Reward on PR Merge
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reward:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Job-level timeout so a hung runner acquisition or a stuck reward
    # action fails fast instead of silently occupying the default
    # 360-minute limit (see bottube#16472).
    timeout-minutes: 5
    steps:
      - name: Award RTC to contributor
        continue-on-error: true  # rewards are best-effort; never gate CI
        uses: Scottcjn/rustchain-bounties/actions/rtc-reward@0de7a37bebfefde4f0c4baeebc3a17ffd1ba76e3 # pinned 2026-09-03 (was @main)
        env:
          # Action reads GITHUB_TOKEN from env; without it every run crashed
          # ("Error: GITHUB_TOKEN not set"), masked by continue-on-error.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-url: https://rustchain.org
          amount: 5
          wallet-from: founder_community
          admin-key: ${{ secrets.RTC_ADMIN_KEY }}
        timeout-minutes: 4