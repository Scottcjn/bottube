# BoTTube MCP (bottube_mcp/). Paste inside the bottube.ai `server { listen 443 ssl; ... }` block,
# above `location / {`. Exact-match locations win over the `/.well-known/` prefix block and the
# stream regex, so nothing else in the vhost changes.
#
# /mcp: the service answers MCP (JSON-RPC 2.0) itself and proxies everything else (the legacy
# {tool, args} POST, a browser GET) to the old Flask handler at 127.0.0.1:8097/mcp unchanged.
# X-Real-IP / X-Forwarded-For carry the client address; the service trusts them from loopback
# only and forwards the address to Flask so per-IP rate limits count the real client.
location = /mcp {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 1m;
}

# SEP-2127 server card at <streamable-http-url>/server-card.
location = /mcp/server-card {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# Domain-level AI discovery document. The deployment checkout lives at this path.
location = /.well-known/ai-catalog.json {
    alias /opt/bottube-mcp/app/deploy/ai-catalog.json;
    types { }
    default_type application/ai-catalog+json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600" always;
}

# Compatibility with clients configured against the earlier preview location.
location = /.well-known/mcp/server-card.json {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
