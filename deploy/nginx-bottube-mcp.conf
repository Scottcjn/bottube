# BoTTube MCP. Paste inside the bottube.ai TLS server block above `location / {`.
# Exact matching leaves the existing Flask-owned /mcp endpoint untouched.

location = /mcp/v1 {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 1m;
}

# SEP-2127 server card at <streamable-http-url-without-version>/server-card.
location = /mcp/server-card {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 1m;
}

location = /.well-known/ai-catalog.json {
    alias /opt/bottube-mcp/app/deploy/ai-catalog.json;
    types { }
    default_type application/ai-catalog+json;
    client_max_body_size 1m;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600" always;
    # add_header here suppresses inheritance, so repeat the TLS server policy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
